# Running locally https://yonatankra.com/how-to-test-github-actions-locally-using-act/
#
# Unit tests and build only. Cloud integration tests live in
# cloud-integration-tests.yml (push trigger, same-repo branches) and
# chatops-pr-test-gate.yml (/ok-to-test comment, fork PRs).
name: Go
on: pull_request
# Cancel in-progress runs for older commits when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_and_test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Set up Go 1.26.0
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.0
        id: go
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Test
        run: go test -v ./...
      - name: Build
        run: go build -v -o ghorg .
  build_and_test_windows:
    name: Build and Test Windows
    runs-on: windows-latest
    steps:
      - name: Set up Go 1.26.0
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.0
        id: go
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set configuration file
        run: |
          mkdir C:\Users\runneradmin\.config\ghorg
          copy sample-conf.yaml C:\Users\runneradmin\.config\ghorg\conf.yaml
      - name: Build
        run: env GOOS=windows GOARCH=386 go build -v -o ghorg.exe .
      - name: Test
        run: go test -v ./...
